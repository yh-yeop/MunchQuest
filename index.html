<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>냠냠 원정대 · 기술 검증</title>
<meta name="description" content="냠냠 원정대(가칭) 기술 검증 M0: 웹 멀티플레이 동기화와 도트 렌더.">
<meta name="theme-color" content="#2b2a3a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/galmuri/galmuri.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="screen" id="screen">
  <canvas id="cv" aria-label="마을"></canvas>

  <div class="hud" id="hud" hidden>
    <div class="bar">
      <b id="room"></b>
      <span id="people"></span>
      <button type="button" id="copy">초대 링크 복사</button>
      <button type="button" id="btnLeave" title="Esc">나가기</button>
    </div>
    <p class="net" id="net"></p>
    <pre class="dbg" id="dbg" hidden></pre>
    <p class="keys">이동 WASD·방향키 · 디버그 F3 · 나가기 Esc</p>
  </div>

  <div class="title" id="title">
    <div class="box">
      <h1>냠냠 원정대</h1>
      <p class="sub">기술 검증 M0 · 그림은 임시</p>
      <p class="mode" id="mode"></p>
      <label class="field">이름 <input id="name" maxlength="12" placeholder="손님" autocomplete="off"></label>
      <button type="button" id="btnHost">방 만들기</button>
      <form id="joinForm" class="join">
        <input id="code" maxlength="4" placeholder="코드" autocomplete="off" aria-label="방 코드">
        <button type="submit">참가</button>
      </form>
      <button type="button" id="btnSolo" class="ghost">혼자 테스트 (봇 3 · 지연 150ms)</button>
      <p class="msg" id="msg" hidden></p>
    </div>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
